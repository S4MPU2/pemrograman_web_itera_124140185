<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini POS Kantin</title>
  <link rel="stylesheet" href="kalku.css">
</head>
<body>
  <main class="container">
    <h1>Mini POS Kantin</h1>

    <section class="card">
      <h2>Tambah Barang</h2>
      <form id="form-barang" novalidate>
        <label for="nama">Nama Barang</label>
        <input type="text" id="nama" placeholder="Contoh: Buku Tulis">
        <small class="error" id="error-nama"></small>

        <label for="harga">Harga Satuan (Rp)</label>
        <input type="number" id="harga" placeholder="Minimal 500">
        <small class="error" id="error-harga"></small>

        <label for="qty">Jumlah</label>
        <input type="number" id="qty" placeholder="Minimal 1">
        <small class="error" id="error-qty"></small>

        <button type="submit">Tambah ke Keranjang</button>
      </form>
    </section>

    <section class="card">
      <h2>Keranjang Belanja</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>No</th><th>Nama Barang</th><th>Harga</th>
              <th>Qty</th><th>Subtotal</th><th>Aksi</th>
            </tr>
          </thead>
          <tbody id="isi-keranjang"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Pembayaran</h2>
      <div class="baris"><span>Total Belanja</span><strong id="total">Rp 0</strong></div>
      <div class="baris"><span>Diskon 10% (min. Rp 50.000)</span><strong id="diskon">Rp 0</strong></div>
      <div class="baris besar"><span>Total Akhir</span><strong id="total-akhir">Rp 0</strong></div>

      <label for="bayar">Uang Bayar (Rp)</label>
      <input type="number" id="bayar" placeholder="Masukkan nominal uang">
      <p id="kembalian" class="info"></p>

      <button type="button" id="btn-reset" class="sekunder">Transaksi Baru</button>
    </section>
  </main>
  <script src="kalku.js"></script>
</body>
</html>
